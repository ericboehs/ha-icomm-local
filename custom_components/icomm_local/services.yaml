set_setpoint:
  name: Set setpoint
  target:
    entity:
      integration: icomm_local
      domain: water_heater
  description: >-
    Queue a tank setpoint. The write is delivered on the appliance's next command
    poll and is only reported as applied once its own telemetry agrees, so allow
    minutes. Values outside the appliance's advertised range are rejected.
  fields:
    temperature:
      name: Temperature
      description: Target water temperature in degrees Fahrenheit.
      required: true
      example: 140
      selector:
        number:
          min: 95
          max: 160
          step: 1
          unit_of_measurement: "°F"

set_mode:
  name: Set mode
  target:
    entity:
      integration: icomm_local
      domain: water_heater
  description: >-
    Queue a heating mode. Electric and heat pump draw very differently, and a mode
    change is visible in the next telemetry as the mode register plus the power draw.
    Vacation is the app's vacation mode; the water heater's away mode sends it too.
  fields:
    mode:
      name: Mode
      description: Which heating mode to select.
      required: true
      selector:
        select:
          options:
            - electric
            - hybrid
            - heat_pump
            - vacation
    days:
      name: Vacation days
      description: >-
        Vacation only: the number of days, as the app asks for it (default 1).
        Whether the tank leaves vacation on its own when they run out has not been
        observed; turn it off yourself to be sure.
      required: false
      selector:
        number:
          min: 1
          max: 99
          mode: box

cancel_writes:
  name: Cancel queued writes
  target:
    entity:
      integration: icomm_local
      domain: water_heater
  description: >-
    Drop everything waiting to be delivered. Nothing already applied is undone.
