# Water Heater dashboard view for ha-icomm-local.
#
# To add it: open a dashboard, click the pencil (Edit dashboard), then + to
# add a view. In the view dialog open the three-dot menu, choose Edit in YAML,
# replace everything with this file, and Save. The entity IDs are the
# integration's defaults; if you renamed entities, change them here to match.
#
# tests_ha/test_dashboard.py checks that every entity here exists on a fresh
# install, so this file cannot drift from the integration.
title: Water Heater
path: water-heater
icon: mdi:water-boiler
type: sections
max_columns: 4
sections:
- type: grid
  cards:
  - type: heading
    heading: Water heater
    heading_style: title
    icon: mdi:water-boiler
    badges:
    - type: entity
      entity: sensor.icomm_water_heater_relay_health
      show_state: true
      show_icon: true
    - type: entity
      entity: sensor.icomm_water_heater_operating_state
      show_state: true
      show_icon: true
    - type: entity
      entity: sensor.icomm_water_heater_mode
      show_state: true
      show_icon: true
    - type: entity
      entity: sensor.icomm_water_heater_heating_element
      show_state: true
      show_icon: true
  - type: thermostat
    entity: water_heater.icomm_water_heater
    features:
    - type: water-heater-operation-modes
      operation_modes:
      - heat_pump
      - eco
      - electric
  - type: tile
    entity: sensor.icomm_water_heater_hot_water_available
    name: Hot water available
    icon: mdi:water-percent
  - type: tile
    entity: sensor.icomm_water_heater_power
    name: Power
  - type: tile
    entity: sensor.icomm_water_heater_heating_element
    name: Element
    icon: mdi:heating-coil
  - type: tile
    entity: sensor.icomm_water_heater_hot_water_level
    name: Hot water level (heater)
    icon: mdi:water-check
  - type: tile
    entity: sensor.icomm_water_heater_fault
    name: Fault
    icon: mdi:alert-circle-outline
  - type: tile
    entity: sensor.icomm_water_heater_pending_write
    name: Pending write
    icon: mdi:timer-sand
- type: grid
  cards:
  - type: heading
    heading: Tank
    heading_style: title
    icon: mdi:thermometer-water
  - type: tile
    entity: sensor.icomm_water_heater_water_tank_top
    name: Top
    icon: mdi:thermometer-chevron-up
  - type: tile
    entity: sensor.icomm_water_heater_water_tank_average
    name: Average
    icon: mdi:thermometer
  - type: tile
    entity: sensor.icomm_water_heater_water_tank_bottom
    name: Bottom
    icon: mdi:thermometer-chevron-down
  - type: tile
    entity: sensor.icomm_water_heater_heat_deficit
    name: Heat deficit
    icon: mdi:fire-alert
  - type: tile
    entity: sensor.icomm_water_heater_energy
    name: Energy (lifetime)
    icon: mdi:counter
  - type: heading
    heading: Setpoints
    heading_style: subtitle
    icon: mdi:target
  - type: tile
    entity: sensor.icomm_water_heater_setpoint
    name: Setpoint
  - type: tile
    entity: sensor.icomm_water_heater_active_setpoint
    name: Active target
  - type: tile
    entity: sensor.icomm_water_heater_max_setpoint
    name: Maximum
  - type: tile
    entity: sensor.icomm_water_heater_energy_capacity
    name: Energy capacity
    icon: mdi:battery-high
  - type: entities
    entities:
    - type: attribute
      entity: sensor.icomm_water_heater_water_tank_average
      attribute: weight_on_top
      name: Average's weight on top
      icon: mdi:scale-balance
    - type: conditional
      conditions:
      - entity: sensor.icomm_water_heater_mode
        state: vacation
      row:
        type: attribute
        entity: water_heater.icomm_water_heater
        attribute: vacation_days
        name: Vacation days left
        icon: mdi:palm-tree
    - type: conditional
      conditions:
      - entity: sensor.icomm_water_heater_pending_write
        state_not: none
      row:
        type: attribute
        entity: water_heater.icomm_water_heater
        attribute: write_status
        name: Last write status
        icon: mdi:check-decagram
- type: grid
  cards:
  - type: heading
    heading: Connection
    heading_style: title
    icon: mdi:wifi
  - type: tile
    entity: sensor.icomm_water_heater_wi_fi_rssi
    name: Wi-Fi
    icon: mdi:wifi
  - type: tile
    entity: sensor.icomm_water_heater_line_voltage
    name: Line voltage
    icon: mdi:sine-wave
  - type: entities
    entities:
    - type: attribute
      entity: sensor.icomm_water_heater_relay_health
      attribute: reasons
      name: Relay health, why
      icon: mdi:heart-pulse
    - type: attribute
      entity: water_heater.icomm_water_heater
      attribute: lan_registered
      name: Local Connect registered
      icon: mdi:lan
  - type: tile
    entity: sensor.icomm_water_heater_last_app_write
    name: Last app write
    icon: mdi:cellphone-arrow-down
    grid_options: &id001
      columns: 12
  - type: heading
    heading: Device
    heading_style: subtitle
    icon: mdi:information-outline
  - type: entities
    entities:
    - type: attribute
      entity: sensor.icomm_water_heater_controller_firmware
      attribute: model_number
      name: Model
      icon: mdi:water-boiler
    - type: attribute
      entity: sensor.icomm_water_heater_controller_firmware
      attribute: serial_number
      name: Serial number
      icon: mdi:barcode
    - entity: sensor.icomm_water_heater_controller_firmware
      name: Controller firmware
    - entity: sensor.icomm_water_heater_wi_fi_module_firmware
      name: Wi-Fi firmware
    - type: attribute
      entity: sensor.icomm_water_heater_wi_fi_module_firmware
      attribute: module_hardware
      name: Wi-Fi module hardware
      icon: mdi:chip
    - type: attribute
      entity: sensor.icomm_water_heater_wi_fi_module_firmware
      attribute: dsn
      name: DSN
      icon: mdi:identifier
    - entity: sensor.icomm_water_heater_expansion_valve_position
      name: Expansion valve
- type: grid
  column_span: 4
  cards:
  - type: heading
    heading: Last 24 hours
    heading_style: title
    icon: mdi:chart-line
  - type: history-graph
    title: Temperatures
    hours_to_show: 24
    entities:
    - entity: sensor.icomm_water_heater_water_tank_top
      name: Top
    - entity: sensor.icomm_water_heater_water_tank_average
      name: Average
    - entity: sensor.icomm_water_heater_water_tank_bottom
      name: Bottom
    - entity: sensor.icomm_water_heater_active_setpoint
      name: Target
    grid_options:
      columns: 12
      rows: 5
  - type: history-graph
    title: Power
    hours_to_show: 24
    entities:
    - entity: sensor.icomm_water_heater_power
      name: Power
    grid_options:
      columns: 6
      rows: 4
  - type: history-graph
    title: Heat deficit
    hours_to_show: 24
    entities:
    - entity: sensor.icomm_water_heater_heat_deficit
      name: Deficit
    grid_options:
      columns: 6
      rows: 4
  - type: history-graph
    title: Mode and element
    hours_to_show: 24
    entities:
    - entity: sensor.icomm_water_heater_mode
      name: Mode
    - entity: sensor.icomm_water_heater_heating_element
      name: Element
    grid_options:
      columns: 12
      rows: 3
  - type: history-graph
    title: Hot water available
    hours_to_show: 24
    entities:
    - entity: sensor.icomm_water_heater_hot_water_available
      name: Hot water
    grid_options: *id001
