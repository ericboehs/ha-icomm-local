name: release

# Push a tag (git tag v0.4.6 && git push origin v0.4.6) and this publishes the
# GitHub release HACS and users see, with notes taken from CHANGELOG.md. It
# refuses to publish unless the tagged commit is on main; the tag,
# relay/config.yaml, manifest.json and the changelog agree; and every check a
# PR gets passes at that commit: tests.yml (relay on each Python, the
# integration in Home Assistant, latest and oldest) and build.yml (the add-on
# image on both architectures, with the relay's tests inside it).
# The order of a release is in docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

# Read-only everywhere except the one job that creates the release.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # origin/main, for the ancestry check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"   # the add-on image's Python
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main"
            exit 1
          }
      - name: Tag, add-on, integration and changelog agree
        run: |
          python scripts/release_check.py versions "$GITHUB_REF_NAME"
          python scripts/release_check.py mirror

  tests:
    uses: ./.github/workflows/tests.yml

  image:
    uses: ./.github/workflows/build.yml

  publish:
    needs: [verify, tests, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # gh release create; nothing else runs here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_check.py notes "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag
