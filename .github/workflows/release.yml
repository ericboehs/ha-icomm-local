name: release

# Push a tag (git tag v0.4.6 && git push origin v0.4.6) and this publishes the
# GitHub release HACS and users see, with notes taken from CHANGELOG.md. It
# refuses to publish if the tag, relay/config.yaml, manifest.json and the
# changelog disagree, or if the tests fail at that commit.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"   # the add-on image's Python
      - name: Tag, add-on, integration and changelog agree
        run: |
          python scripts/release_check.py versions "$GITHUB_REF_NAME"
          python scripts/release_check.py mirror
      - name: Tests pass at this commit
        run: |
          pip install --require-hashes -r relay/requirements.txt
          pip install -r requirements-dev.txt
          ruff check .
          python -m pytest --cov=relay --cov-fail-under=95
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_check.py notes "$GITHUB_REF_NAME" > notes.md
          title="$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --verify-tag
