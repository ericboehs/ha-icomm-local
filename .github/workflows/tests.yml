name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"      # weekly: catch dependency drift early

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the add-on image runs; the rest are what users may bring.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (coverage gate 95%)
        run: |
          python -m pytest --cov=relay --cov-report=term-missing \
            --cov-report=markdown:coverage.md --cov-fail-under=95
      - name: Coverage summary
        if: always() && matrix.python-version == '3.12'
        run: |
          echo "### Relay coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          cat coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Changelog mirror and versions agree
        run: |
          python scripts/release_check.py mirror
          python scripts/release_check.py same-version

  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is Alpine (busybox sh, no bash): every script must be POSIX.
      - name: Scripts are POSIX sh
        run: shellcheck -s sh relay/*.sh
      - name: Scripts run under busybox sh, as in the image
        run: |
          docker run --rm -v "$PWD/relay:/r" -e CERT_DIR=/tmp/c alpine:3 \
            sh -c 'apk add -q --no-cache openssl && cp /r/dhparams-default.pem /tmp/dh.pem 2>/dev/null; mkdir -p /tmp/c && cp /tmp/dh.pem /tmp/c/dhparams.pem 2>/dev/null; /r/gen-cert.sh && openssl x509 -in /tmp/c/aylanetworks.com.crt -noout -subject'
      - name: Validate the add-on configuration
        uses: frenck/action-addon-linter@v2
        with:
          path: "./relay"

  # The integration inside real Home Assistant. Added after a TypeError that no
  # other test could see (`timeout_seconds=` is not an aiohttp keyword) would have
  # broken the very first refresh on a real install.
  ha-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: pip install pytest-homeassistant-custom-component pytest-cov
      - name: Test (coverage gate 95%)
        run: |
          python -m pytest tests_ha -p no:cacheprovider -o asyncio_mode=auto \
            --cov=custom_components/icomm_local --cov-report=term-missing \
            --cov-report=markdown:coverage.md --cov-fail-under=95
      - name: Coverage summary
        if: always()
        run: |
          echo "### Integration coverage" >> "$GITHUB_STEP_SUMMARY"
          cat coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
