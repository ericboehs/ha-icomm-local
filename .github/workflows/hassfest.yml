name: hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Home Assistant's own validator: manifest keys, translations, config flow.
      - uses: home-assistant/actions/hassfest@master
