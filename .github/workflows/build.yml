name: add-on image

# Build the relay image for both architectures the add-on declares, so a broken
# Dockerfile or dependency fails here instead of in a user's Supervisor.
on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/build.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]   # add-on arch: amd64, aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: relay
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: icomm-relay:ci
      - name: The image starts and imports the relay
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3 icomm-relay:ci \
            -c "import sys, icomm_relay, icomm_lan, icomm_peers, icomm_frames; print('imports ok', sys.version)"
      # The relay's test suite inside the image users actually run: its Python,
      # its musl wheels from the hash-checked lock, on each architecture (arm64
      # under QEMU, as on a Raspberry Pi or HA Green).
      - name: Relay test suite inside the image
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/src:ro" \
            --entrypoint sh icomm-relay:ci -c '
              pip install -q --root-user-action=ignore -r /src/requirements-dev.txt &&
              cp -r /src /tmp/src && cd /tmp/src &&
              python -W error::DeprecationWarning -m pytest tests -W error::Warning -o addopts=""'
