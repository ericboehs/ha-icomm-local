name: add-on image

# Build the relay image for both architectures the add-on declares, so a broken
# Dockerfile or dependency fails here instead of in a user's Supervisor.
on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/build.yml"]

permissions:
  contents: read

jobs:
  build:
    # Each architecture on its own native runner: arm64 under QEMU took ~8 min
    # (the whole suite emulated), natively about one.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:                                # add-on arch: amd64, aarch64
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: relay
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: icomm-relay:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: The image starts and imports the relay
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3 icomm-relay:ci \
            -c "import sys, icomm_relay, icomm_lan, icomm_peers, icomm_frames, icomm_firmware, icomm_dns, icomm_device, icomm_offline, icomm_heater, icomm_hub; print('imports ok', sys.version)"
      # The relay's test suite inside the image users actually run: its Python,
      # its musl wheels from the hash-checked lock, on each architecture (arm64
      # as on a Raspberry Pi or HA Green).
      - name: No pip in the shipped image
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint sh icomm-relay:ci \
            -c '! python -c "import pip" 2>/dev/null && echo "pip removed"'
      - name: No known vulnerabilities in the shipped image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: icomm-relay:ci
          version: v0.76.1          # explicit; 0.69.4 was the compromised release
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Relay test suite inside the image
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/src:ro" \
            --entrypoint sh icomm-relay:ci -c '
              python -m ensurepip --default-pip >/dev/null &&
              pip install -q --root-user-action=ignore -r /src/requirements-dev.txt &&
              cp -r /src /tmp/src && cd /tmp/src &&
              python -W error::DeprecationWarning -m pytest tests -W error::Warning -o addopts=""'
