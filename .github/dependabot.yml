version: 2
updates:
  # The add-on's runtime lock: relay/requirements.txt is compiled from
  # requirements.in by `uv pip compile --generate-hashes`. Dependabot's uv
  # ecosystem recompiles it the same way, so pins and hashes stay consistent.
  - package-ecosystem: uv
    directory: /relay
    schedule:
      interval: weekly
    groups:
      relay-runtime:
        patterns: ["*"]
  # Dev and test tools (requirements-dev.txt). relay/ is excluded so this scan
  # and the uv one never open competing PRs for the same lock.
  - package-ecosystem: pip
    directory: /
    exclude-paths: ["relay/**"]
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The relay's base image: python:<version>-alpine<version>@<digest>.
  # Patch releases and digest refreshes only. A new Python minor (3.12 -> 3.15
  # was the first PR this opened) is a deliberate change: add it to the CI
  # matrix first, then bump the Dockerfile by hand.
  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
