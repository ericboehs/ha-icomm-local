name: iCOMM Local Relay
version: "0.3.6"
slug: icomm_relay
description: Transparent local relay and decoder for A.O. Smith iCOMM water heaters
url: https://github.com/ericboehs/ha-icomm-local
arch:
  - aarch64
  - amd64
# The module is steered here by the router's DNAT rule, so the listener must be
# on the host's network namespace at the address the route points to.
host_network: true
init: false
options:
  listen_port: 8444
  state_port: 8124
  upstream: proxy-ingress-usfield.aylanetworks.com
  device_dsn: ""
  lan_mode: true
  lan_port: 8888
  module_ip: ""
  relay_ip: ""
schema:
  listen_port: port
  state_port: port
  upstream: str
  device_dsn: str?
  # Local doorbell: Ayla Local Connect with a relay-minted key. No A.O. Smith
  # account. The module polls this relay locally every ~10 s once armed.
  lan_mode: bool
  lan_port: port
  # Usually learned from the module's own registration reply; set only if the
  # module is on another subnet or callback detection picks the wrong address.
  module_ip: str?
  relay_ip: str?
map:
  - share:ro
