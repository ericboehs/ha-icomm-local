name: iCOMM Local Relay
version: "0.5.1"
slug: icomm_relay
description: Transparent local relay and decoder for A.O. Smith iCOMM water heaters
url: https://github.com/ericboehs/ha-icomm-local
arch:
  - aarch64
  - amd64
# The module is steered here by the router's DNAT rule, so the listener must be
# on the host's network namespace at the address the route points to.
host_network: true
init: false
options:
  listen_port: 8444
  state_port: 8124
  upstream: proxy-ingress-usfield.aylanetworks.com
  device_dsn: ""
  lan_mode: true
  lan_port: 8888
  module_ip: ""
  relay_ip: ""
  trusted_peers: ""
  firmware_updates: hold
schema:
  listen_port: port
  state_port: port
  upstream: str
  device_dsn: str?
  # Local doorbell: Ayla Local Connect with a relay-minted key. No A.O. Smith
  # account. The module polls this relay locally every ~10 s once armed.
  lan_mode: bool
  lan_port: port
  # Usually learned from the module's own registration reply; set only if the
  # relay should know it before the module's next registration, or callback
  # detection picks the wrong address. The module must be on the same subnet.
  module_ip: str?
  relay_ip: str?
  # The module-facing ports answer only the module: the gateway's address (the
  # NAT rules make the module arrive from it) and the module's own address.
  # Add comma-separated addresses here only for unusual steering; "*" disables
  # the check.
  trusted_peers: str?
  # Firmware updates for the module or the heater's controller arrive through
  # the relay. "hold" keeps them from the module and raises a Home Assistant
  # repair to allow each one; an update could end local control. "allow"
  # passes them as before.
  firmware_updates: list(hold|allow)
map:
  - share:ro
